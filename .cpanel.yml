---
deployment:
  tasks:
    - |
      # This repo is a TypeScript Fastify service that builds to dist/.
      # Build with vp run build:all before deployment; never build inside cPanel.
      # Set these to your own cPanel account and application directory.
      export CPANEL_USER="<your-cpanel-user>"
      export APP_DIR="/home/$CPANEL_USER/repo/keyforge"

      # 1. Prepare the app directory structure for Passenger and the SQLite database.
      /bin/mkdir -p "$APP_DIR"
      /bin/mkdir -p "$APP_DIR/tmp"
      /bin/mkdir -p "$APP_DIR/db"

      # 2. Deploy only the runtime artifacts needed by the service.
      # The app starts with: node --env-file-if-exists=.env.local dist/src/index.js
      /bin/cp -R dist "$APP_DIR/"
      /bin/cp dist/runtime-package.json "$APP_DIR/package.json"
      /bin/cp dist/runtime-pnpm-workspace.yaml "$APP_DIR/pnpm-workspace.yaml"
      /bin/cp -R scripts "$APP_DIR/"

      # 3. Initialize the database file only if it does not already exist.
      # Do not overwrite a live production file or copy the local SQLite database blindly.
      if [ ! -f "$APP_DIR/db/licenses.sqlite" ]; then
        /bin/touch "$APP_DIR/db/licenses.sqlite"
      fi

      # 4. Restart Phusion Passenger so the new build is picked up.
      /bin/touch "$APP_DIR/tmp/restart.txt"
