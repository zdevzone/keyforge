packages:
  - ui
  - packages/*

# Explicit lifecycle permissions for native/runtime tooling.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  # UploadThing pins an older Effect; keep the compatible patched 3.x runtime.
  effect: 3.22.2
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
