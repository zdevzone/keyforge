services:
  - type: web
    name: keyforge
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: off
    # Bootstrap Vite+ because Render's native Node runtime does not provide it.
    buildCommand: set -o pipefail && curl -fsSL https://vite.plus | VP_HOME="$HOME/.vite-plus" VP_VERSION=1.1.0 VP_NODE_MANAGER=no bash && export PATH="$HOME/.vite-plus/bin:$PATH" && NODE_ENV=development vp install --frozen-lockfile && vp run build:all
    startCommand: node dist/src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: LICENSE_HOST
        value: 0.0.0.0
      - key: LICENSE_DB_PATH
        value: ./db/licenses.sqlite
      - key: LICENSE_ADMIN_TOKEN
        sync: false
      - key: LICENSE_SIGNING_KEY
        sync: false
      - key: LICENSE_AUTH_SECRET
        sync: false
      - key: LICENSE_SEED_ADMIN_EMAIL
        sync: false
      - key: LICENSE_SEED_ADMIN_PASSWORD
        sync: false
