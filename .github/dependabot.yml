version: 2
updates:
  - package-ecosystem: npm
    # pnpm-workspace.yaml discovers ui/ and packages/* with one lockfile.
    # Listing workspace directories again creates duplicate update PRs.
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # One PR for patch and minor bumps; majors stay separate so they get
      # read properly.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
