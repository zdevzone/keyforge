version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /ui
      - /packages/keyforge-client
      - /packages/create-keyforge
      - /packages/create-keyforge-client
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      # One PR for patch and minor bumps; majors stay separate so they get
      # read properly.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
