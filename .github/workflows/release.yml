name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and pack only; do not publish to npm
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'zdevzone/keyforge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.1.0"
          node-version: "24.21.0"
          cache: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run build:all
      - run: vp run test
      - run: vp run test:packages
      - name: Verify browser workflows
        run: |
          vp exec playwright install --with-deps chromium
          vp run test:console
          vp run test:issuance
          vp run test:docs
      - name: Pack and verify release archives
        run: node scripts/release-packages.mjs pack
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .artifacts/release/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: checks
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .artifacts/release
      - name: Publish SDK, server CLI, then client CLI
        run: node scripts/release-packages.mjs publish
