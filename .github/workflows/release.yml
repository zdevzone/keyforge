name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable from main; beta from dev
        type: choice
        options: [stable, beta]
        default: stable
        required: true
      dry_run:
        description: Check and pack only; do not publish to npm
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  checks:
    if: github.repository == 'zdevzone/keyforge'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release branch and channel
        run: node --input-type=module -e 'import { assertReleaseContext } from "./scripts/release-packages.mjs"; assertReleaseContext(process.env)'
      - name: Require successful branch CI, including databases and platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/zdevzone/keyforge/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" |
            jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '.workflow_runs | map(select(.head_branch == $branch))[0] | .head_sha == $sha and .status == "completed" and .conclusion == "success"'
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: "1.1.0"
          node-version: "24.21.0"
          cache: false
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run build:all
      - run: vp run test
      - run: vp run test:packages
      - name: Verify browser workflows
        run: |
          vp exec playwright install --with-deps chromium
          vp run test:console
          vp run test:issuance
          vp run test:docs
      - name: Pack and verify release archives
        run: node scripts/release-packages.mjs pack
      - name: Exercise the exact release archives
        run: vp run test:packages
        env:
          RELEASE_ARCHIVES: ${{ github.workspace }}/.artifacts/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: |
            .artifacts/release/*.tgz
            .artifacts/release/release-context.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: checks
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: .artifacts/release
      - name: Publish SDK, server CLI, then client CLI
        run: node scripts/release-packages.mjs publish
