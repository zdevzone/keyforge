name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.23.3", "24.21.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.1.0"
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run build:all
      - run: vp run test
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: |
          vp exec playwright install --with-deps chromium
          vp run test:console
          vp run test:issuance
          vp run test:docs
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16.15", "18.6"]
        include:
          - postgres: "16.15"
            client: 16
          - postgres: "18.6"
            client: 18
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: keyforge
          POSTGRES_PASSWORD: keyforge
          POSTGRES_DB: keyforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version: "1.1.0"
          node-version: "24.21.0"
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install compatible Postgres backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.client }}
          echo "/usr/lib/postgresql/${{ matrix.client }}/bin" >> "$GITHUB_PATH"
      - run: vp run build
      - run: vp run test
        env:
          TEST_DATABASE_URL: postgres://keyforge:keyforge@localhost:5432/keyforge_test?sslmode=disable
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t keyforge .
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Build with Render configuration
        run: set -o pipefail && curl -fsSL https://vite.plus | VP_HOME="$HOME/.vite-plus" VP_VERSION=1.1.0 VP_NODE_MANAGER=no bash && export PATH="$HOME/.vite-plus/bin:$PATH" && NODE_ENV=development vp install --frozen-lockfile && vp run build:all
        env:
          NODE_ENV: production
