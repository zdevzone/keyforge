name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.23.3", "24.21.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: "1.1.0"
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run build:all
      - run: vp run test
      - if: (matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest') && matrix.node == '24.21.0'
        run: vp run test:packages
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24.21.0'
        run: |
          vp exec playwright install --with-deps chromium
          vp run test:console
          vp run test:issuance
          vp run test:docs
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["16.15", "18.6"]
        include:
          - postgres: "16.15"
            client: 16
          - postgres: "18.6"
            client: 18
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: keyforge
          POSTGRES_PASSWORD: keyforge
          POSTGRES_DB: keyforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: "1.1.0"
          node-version: "24.21.0"
          cache: true
      - run: vp install --frozen-lockfile
      - name: Install compatible Postgres backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-${{ matrix.client }}
          echo "/usr/lib/postgresql/${{ matrix.client }}/bin" >> "$GITHUB_PATH"
      - run: vp run build
      # Better Auth introspects the database-wide catalog. Concurrent fixture
      # schema drops can invalidate that scan even across isolated schemas.
      - run: vp run test:postgres
        env:
          TEST_DATABASE_URL: postgres://keyforge:keyforge@localhost:5432/keyforge_test?sslmode=disable
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t keyforge .
  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build with Vercel configuration without deployment credentials
        run: bash scripts/vercel-install.sh && export PATH="$HOME/.vite-plus/bin:$PATH" && vp run build:all && node --check api/index.mjs
        env:
          NODE_ENV: production
  gate:
    name: CI passed
    if: always()
    needs: [test, postgres, docker, vercel]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'length == 4 and all(.[]; .result == "success")'
